name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Expo doctor
        run: npx expo-doctor
      - name: Validate public config
        run: npx expo config --type public > /dev/null

# Note: no web export step. The app depends on native-only modules
# (react-native-pdf, react-native-webrtc) that cannot bundle for web.
# Native builds are done via EAS, not GitHub Actions runners.
